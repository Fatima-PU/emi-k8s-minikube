<!doctype html>
<html>
<head>
<title>Loan EMI Calculator v1.1</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">
<h3>Loan EMI Calculator v1.1</h3>
<form id="f" class="row g-2 mb-3">
  <div class="col"><input class="form-control" id="P" type="number" min="1" step="any" placeholder="Loan amount" required></div>
  <div class="col"><input class="form-control" id="rate" type="number" min="0.01" step="any" placeholder="Annual rate %" required></div>
  <div class="col"><input class="form-control" id="n" type="number" min="1" step="1" placeholder="Months" required></div>
  <div class="col-auto"><button class="btn btn-primary">Calculate</button></div>
</form>
<div id="result" class="alert d-none"></div>
<table class="table table-sm">
  <thead><tr><th>Amount</th><th>Rate %</th><th>Months</th><th>EMI</th><th>Served By</th><th>Time</th></tr></thead>
  <tbody id="h"></tbody>
</table>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>
function load() {
  $.get("/api/history", function (rows) {
    $("#h").html(rows.map(r => `<tr><td>${r.principal}</td><td>${r.rate}</td><td>${r.months}</td><td>${r.emi}</td><td>${r.servedBy}</td><td>${r.createdAt}</td></tr>`).join(""));
  });
}
$("#f").on("submit", function (e) {
  e.preventDefault();
  $.ajax({
    url: "/api/emi", method: "POST", contentType: "application/json",
    data: JSON.stringify({P: $("#P").val(), rate: $("#rate").val(), n: $("#n").val()}),
    success: function (d) {
      $("#result").attr("class", "alert alert-success").html(`EMI: ${d.emi} | Total Payment: ${d.totalPayment} | Total Interest: ${d.totalInterest}<br>Pod: ${d.servedBy} (${d.podIp})`);
      load();
    },
    error: function (x) { $("#result").attr("class", "alert alert-danger").text(x.responseJSON.error); }
  });
});
load();
</script>
</body>
</html>
